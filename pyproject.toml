[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "remote-fileshare"
dynamic = ["version"]
description = "Send screenshots and files from your browser to Claude Code, Codex CLI and other AI agents running on a remote Linux server, and download what they produce. One command, password, HTTPS, zero dependencies. 远程文件共享：在远程 Linux 机器上用 Claude Code、Codex CLI 写代码时，从浏览器把截图、文件传给 AI agent，并把结果下载回本地；一行 npx / uvx 启动，带密码、HTTPS、零依赖"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "chao5go" }]
keywords = ["remote", "file-sharing", "file-transfer", "file-server", "upload", "screenshot", "ai-agent", "claude-code", "codex", "ssh", "zero-dependency", "self-hosted", "npx", "uvx"]
classifiers = [
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: File Sharing",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

[project.urls]
Homepage = "https://github.com/chao5go/remote-fileshare"
Documentation = "https://github.com/chao5go/remote-fileshare#readme"
Issues = "https://github.com/chao5go/remote-fileshare/issues"
Changelog = "https://github.com/chao5go/remote-fileshare/releases"
npm = "https://www.npmjs.com/package/remote-fileshare"

[project.scripts]
remote-fileshare = "remote_fileshare.server:main"

[tool.hatch.version]
path = "src/remote_fileshare/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/remote_fileshare"]

[tool.hatch.build.targets.sdist]
include = ["src/remote_fileshare", "README.md", "LICENSE"]
